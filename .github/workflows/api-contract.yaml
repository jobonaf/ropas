on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: api-contract

jobs:
  api-contract:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ROPAS_RUN_CONTRACT_TESTS: "true"
      OPAS_USER: ${{ secrets.OPAS_USER }}
      OPAS_PASSWORD: ${{ secrets.OPAS_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes

      - name: Install package
        run: |
          remotes::install_local(".", dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Run API contract tests
        run: |
          testthat::test_dir(
            "tests/testthat/contract",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}